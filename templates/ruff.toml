line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # black handles line length

# Typer + FastAPI use callables in argument defaults as their public API
# (``typer.Option(...)``, ``typer.Argument(...)``, ``fastapi.Depends(...)``).
# Treat them as immutable so B008 doesn't fire on idiomatic usage.
[lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[format]
quote-style = "double"
