apiVersion: parthenon.acumenus.net/v1
kind: Template
metadata:
  id: load_athena_vocabulary
  name: "Load Athena Vocabulary Bundle"
  version: 0.1.0
  category: vocabulary
  tags: [vocabulary, athena, snomed, rxnorm, loinc, cpt4, user-initiated]
  cdm_versions: ["5.3", "5.4"]
  author: "Parthenon Project"
  singleton: true
spec:
  parameters:
    type: object
    required: [bundle_path, target_vocab_schema]
    properties:
      bundle_path:
        type: string
        description: "Absolute path to extracted Athena bundle directory containing CONCEPT.csv etc."
      target_vocab_schema:
        type: string
        default: "vocab"
        description: "Target schema for vocabulary tables. Created if absent."
        pattern: "^[a-z][a-z0-9_]*$"
      force:
        type: boolean
        default: false
        description: "If true, overwrite an existing identical bundle. Required to re-load the same SHA256 reference."
      enable_cpt4:
        type: boolean
        default: true
        description: "Run cpt4.jar to load CPT4 codes. Skipped with a warning if UMLS_API_KEY env var is not set."
  requires:
    cdm_initialized: false
    vocabularies: []
  nodes:
    # Node 1 of 10 — bootstrap target schema and audit table.
    - node_id: ensure_audit_table
      type: sql
      params:
        statements:
          - "CREATE SCHEMA IF NOT EXISTS ${parameters.target_vocab_schema}"
          - |
            CREATE TABLE IF NOT EXISTS ${parameters.target_vocab_schema}.vocabulary_load (
              id BIGSERIAL PRIMARY KEY,
              bundle_path TEXT NOT NULL,
              bundle_reference TEXT NOT NULL,
              loaded_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              row_counts JSONB
            )

    # Node 2 of 10 — idempotency check: hash CONCEPT.csv, abort no-op unless force=true.
    - node_id: idempotency_check
      type: python
      depends_on: [ensure_audit_table]
      params:
        inputs:
          bundle_path: "${parameters.bundle_path}"
          target_vocab_schema: "${parameters.target_vocab_schema}"
          force: "${parameters.force}"
        code: |
          import hashlib
          from pathlib import Path

          from sqlalchemy import create_engine, text

          def main(context, params):
              if not context.db_dsn:
                  raise RuntimeError(
                      "load_athena_vocabulary requires context.db_dsn"
                  )
              bundle = Path(params["bundle_path"])
              concept_csv = bundle / "CONCEPT.csv"
              if not concept_csv.exists():
                  raise FileNotFoundError(
                      f"Athena bundle missing CONCEPT.csv: {concept_csv}"
                  )

              hasher = hashlib.sha256()
              with concept_csv.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(64 * 1024), b""):
                      hasher.update(chunk)
              digest = hasher.hexdigest()

              schema = params["target_vocab_schema"]
              engine = create_engine(context.db_dsn, future=True)
              with engine.connect() as conn:
                  existing = conn.execute(
                      text(
                          f"SELECT id FROM {schema}.vocabulary_load "
                          "WHERE bundle_reference = :digest LIMIT 1"
                      ),
                      {"digest": digest},
                  ).first()

              already_loaded = existing is not None
              force = bool(params.get("force", False))
              if already_loaded and not force:
                  context.logger.info(
                      "Bundle %s already loaded; pass force=true to reload.",
                      digest,
                  )
              return {
                  "digest": digest,
                  "already_loaded": already_loaded,
                  "skip": already_loaded and not force,
              }

    # Node 3 of 10 — CONCEPT.csv → vocab.concept (truncate-and-load).
    - node_id: load_concept
      type: python
      depends_on: [idempotency_check]
      params:
        inputs:
          bundle_path: "${parameters.bundle_path}"
          target_vocab_schema: "${parameters.target_vocab_schema}"
          file_name: "CONCEPT.csv"
          target_table: "concept"
        code: |
          from pathlib import Path

          from sqlalchemy import create_engine, text

          def main(context, params):
              if not context.db_dsn:
                  raise RuntimeError("load_concept requires context.db_dsn")
              schema = params["target_vocab_schema"]
              table = params["target_table"]
              src = Path(params["bundle_path"]) / params["file_name"]
              if not src.exists():
                  raise FileNotFoundError(f"missing bundle file: {src}")

              engine = create_engine(context.db_dsn, future=True)
              with engine.begin() as conn:
                  conn.execute(text(f"TRUNCATE TABLE {schema}.{table}"))
                  raw = conn.connection.driver_connection
                  with src.open("r", encoding="utf-8") as fh, raw.cursor() as cur:
                      cur.copy_expert(
                          f"COPY {schema}.{table} FROM STDIN WITH ("
                          "FORMAT csv, DELIMITER E'\\t', HEADER true, "
                          "QUOTE E'\\b', NULL ''"
                          ")",
                          fh,
                      )
                  rows = conn.execute(
                      text(f"SELECT COUNT(*) FROM {schema}.{table}")
                  ).scalar_one()
              return {"target": f"{schema}.{table}", "rows_loaded": int(rows)}

