    # Node 10 of 10 — optional CPT4 enrichment via OHDSI cpt4.jar; gated on
    # parameters.enable_cpt4 AND UMLS_API_KEY env var. Records the audit row
    # in vocabulary_load with the canonical bundle digest.
    - node_id: load_cpt4_and_record
      type: python
      depends_on: [load_drug_strength]
      params:
        inputs:
          bundle_path: "${parameters.bundle_path}"
          target_vocab_schema: "${parameters.target_vocab_schema}"
          enable_cpt4: "${parameters.enable_cpt4}"
        code: |
          import json
          import os
          import subprocess
          from pathlib import Path

          from sqlalchemy import create_engine, text

          CPT4_JAR = "/opt/parthenon/cpt4.jar"

          def main(context, params):
              if not context.db_dsn:
                  raise RuntimeError("load_cpt4_and_record requires context.db_dsn")
              schema = params["target_vocab_schema"]
              bundle_path = params["bundle_path"]
              enable_cpt4 = bool(params.get("enable_cpt4", True))

              # CPT4 step — gracefully skipped when UMLS_API_KEY is absent.
              cpt4_status = "skipped"
              api_key = os.environ.get("UMLS_API_KEY", "")
              if not enable_cpt4:
                  context.logger.info("CPT4 disabled by parameter; skipping")
              elif not api_key:
                  context.logger.warning(
                      "UMLS_API_KEY not set; skipping CPT4 load"
                  )
              elif not Path(CPT4_JAR).exists():
                  context.logger.warning(
                      "cpt4.jar not present at %s; skipping CPT4 load",
                      CPT4_JAR,
                  )
              else:
                  # SECURITY: api_key is read from env, never logged. Pass via
                  # stdin in a future revision; current OHDSI cpt4.jar requires
                  # CLI arg parity. Caller must run inside an isolated container.
                  subprocess.run(
                      [
                          "java",
                          "-jar",
                          CPT4_JAR,
                          bundle_path,
                          api_key,
                          schema,
                      ],
                      check=True,
                  )
                  cpt4_status = "loaded"

              # Compute the same SHA256 the idempotency_check used so the audit
              # row is self-consistent without cross-node output coupling.
              import hashlib

              hasher = hashlib.sha256()
              concept_csv = Path(bundle_path) / "CONCEPT.csv"
              with concept_csv.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(64 * 1024), b""):
                      hasher.update(chunk)
              digest = hasher.hexdigest()

              # Compute row counts and persist audit row.
              tables = [
                  "concept",
                  "concept_relationship",
                  "concept_ancestor",
                  "vocabulary",
                  "domain",
                  "concept_synonym",
                  "drug_strength",
              ]
              engine = create_engine(context.db_dsn, future=True)
              row_counts: dict[str, int] = {}
              with engine.connect() as conn:
                  for table in tables:
                      n = conn.execute(
                          text(f"SELECT COUNT(*) FROM {schema}.{table}")
                      ).scalar_one()
                      row_counts[table] = int(n)
              with engine.begin() as conn:
                  conn.execute(
                      text(
                          f"INSERT INTO {schema}.vocabulary_load "
                          "(bundle_path, bundle_reference, row_counts) "
                          "VALUES (:bundle_path, :digest, CAST(:row_counts AS JSONB))"
                      ),
                      {
                          "bundle_path": bundle_path,
                          "digest": digest,
                          "row_counts": json.dumps(row_counts),
                      },
                  )
              return {
                  "cpt4_status": cpt4_status,
                  "digest": digest,
                  "row_counts": row_counts,
              }
  post_conditions:
    - kind: row_count
      params:
        table: "${parameters.target_vocab_schema}.concept"
        min: 1000000
    - kind: row_count
      params:
        table: "${parameters.target_vocab_schema}.vocabulary"
        min: 30
    - kind: row_count
      params:
        table: "${parameters.target_vocab_schema}.concept_ancestor"
        min: 5000000
    - kind: assertion
      params:
        description: "vocabulary_load audit row exists for this bundle"
        sql: "SELECT COUNT(*) FROM ${parameters.target_vocab_schema}.vocabulary_load"
        min: 1
