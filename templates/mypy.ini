[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
disallow_any_unimported = True
warn_unreachable = True
namespace_packages = True
explicit_package_bases = True
# Phase 3 Plan 1 (T-021A): mypy_path includes the commercial source root so
# ``runtime/__init__.py``'s pkgutil.extend_path() namespace merge resolves at
# type-check time too. Running ``mypy --strict runtime`` will traverse into
# ``runtime.commercial.*`` even though the source physically lives at
# ``commercial/runtime/commercial/``.
mypy_path = .:commercial
# Versioned pattern-library directories (e.g. artemis/v0.1.0/) are not valid
# Python package names — they hold JSON data + an __init__.py for path
# resolution only. Skip them so --strict doesn't trip on the dotted dir name.
exclude = runtime/oncology/artemis/v[0-9]+\.[0-9]+\.[0-9]+/

[mypy-prefect.*]
ignore_missing_imports = True

[mypy-pyomop.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True
disallow_any_unimported = False

# pyarrow lacks shipped type stubs; relax disallow_any_unimported for the one
# consumer that imports it directly.
[mypy-runtime.nodes.fhir_resource]
disallow_any_unimported = False

[mypy-pyreadstat]
ignore_missing_imports = True

# pyreadstat lacks shipped type stubs; relax disallow_any_unimported for the
# one consumer that imports it directly.
[mypy-runtime.nodes.sdtm_domain]
disallow_any_unimported = False

# Phase 3 Plan 1 (T-021A): pyx12 (BSD-3) ships its own type annotations
# inline (PEP 561 marker not declared) but mypy --strict's
# disallow_any_unimported still trips on its imports. Treat as third-party
# without stubs.
[mypy-pyx12]
ignore_missing_imports = True

[mypy-pyx12.*]
ignore_missing_imports = True

# Two consumers of pyx12 (X12 837 reader + Plan 2's 835 reader) import it
# directly; relax disallow_any_unimported there.
[mypy-runtime.commercial.claims.readers.x12_837]
disallow_any_unimported = False

[mypy-runtime.commercial.claims.readers.x12_835]
disallow_any_unimported = False

# Phase 3 Plan 5 (T-023): hl7 (BSD) does not ship a py.typed marker; mypy
# --strict's disallow_any_unimported trips on its segment / message types.
[mypy-hl7]
ignore_missing_imports = True

[mypy-hl7.*]
ignore_missing_imports = True

# The HL7 v2 ORU reader imports hl7 directly; relax disallow_any_unimported
# there so segment / message accessors don't surface as Any-tainted errors.
[mypy-runtime.nodes.hl7v2_oru_reader]
disallow_any_unimported = False

