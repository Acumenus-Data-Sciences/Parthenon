[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
disallow_any_unimported = True
warn_unreachable = True
namespace_packages = True
explicit_package_bases = True
mypy_path = .
# Versioned pattern-library directories (e.g. artemis/v0.1.0/) are not valid
# Python package names — they hold JSON data + an __init__.py for path
# resolution only. Skip them so --strict doesn't trip on the dotted dir name.
exclude = runtime/oncology/artemis/v[0-9]+\.[0-9]+\.[0-9]+/

[mypy-prefect.*]
ignore_missing_imports = True

[mypy-pyomop.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True
disallow_any_unimported = False

# pyarrow lacks shipped type stubs; relax disallow_any_unimported for the one
# consumer that imports it directly.
[mypy-runtime.nodes.fhir_resource]
disallow_any_unimported = False

[mypy-pyreadstat]
ignore_missing_imports = True

# pyreadstat lacks shipped type stubs; relax disallow_any_unimported for the
# one consumer that imports it directly.
[mypy-runtime.nodes.sdtm_domain]
disallow_any_unimported = False

