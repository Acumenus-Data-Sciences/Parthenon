[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
disallow_any_unimported = True
warn_unreachable = True
namespace_packages = True
explicit_package_bases = True
mypy_path = .

[mypy-prefect.*]
ignore_missing_imports = True

[mypy-pyomop.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True
disallow_any_unimported = False

# pyarrow lacks shipped type stubs; relax disallow_any_unimported for the one
# consumer that imports it directly.
[mypy-runtime.nodes.fhir_resource]
disallow_any_unimported = False

[mypy-pyreadstat]
ignore_missing_imports = True

# pyreadstat lacks shipped type stubs; relax disallow_any_unimported for the
# one consumer that imports it directly.
[mypy-runtime.nodes.sdtm_domain]
disallow_any_unimported = False

