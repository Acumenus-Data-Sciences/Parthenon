[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
disallow_any_unimported = True
warn_unreachable = True
namespace_packages = True
explicit_package_bases = True
mypy_path = .

[mypy-prefect.*]
ignore_missing_imports = True

[mypy-pyomop.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

