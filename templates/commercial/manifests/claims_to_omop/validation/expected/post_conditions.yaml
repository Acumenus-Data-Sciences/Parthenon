# Phase 3 Plan 1 Task 10: validation pack for the claims_to_omop manifest.
#
# Acceptance thresholds for the seed=42 / n_claims=100 synthetic corpus.
# The 100k-line E2E (tests/e2e/commercial/test_claims_to_omop_837.py)
# scales these counts up to a corpus generated with n_claims sized so
# the line count crosses 100,000.
#
# Mix is approximately 33/33/33 P/I/D (forced first three slots + uniform
# random thereafter). Per-line charge ranges:
#   P: $50 - $500   (1-3 lines)
#   I: $500 - $3000 (2-4 lines)
#   D: $50 - $300   (1-3 lines)

reference_counts:
  # Expected for n_claims=100 (matches cost_sentinels.csv exactly).
  total_claims: 100
  total_lines: 223
  visits_min: 100      # one visit per claim
  procedures_min: 200  # ~2 lines per claim on average
  conditions_min: 100  # one HI*ABK per claim minimum
  cost_rows_min: 250   # 223 line charged + 26 I-claim header charged

artifact_name: claims_to_omop_summary.json
validation_artifact: claims_to_omop_validation.json

# Sentinel tolerance for the 100k-line E2E. Row counts must be within
# +/- 2% of the projected scale-up (perf-budget T-021 §"why this matters").
sentinel_tolerance_pct: 2.0

# Acceptance gates the E2E asserts against:
#   - orphan_procedure_count == 0
#   - overall_status == 'PASS'
#   - 100k-line corpus parses + projects in <30 minutes
gates:
  orphan_procedure_count: 0
  overall_status: PASS
  perf_budget_minutes: 30
