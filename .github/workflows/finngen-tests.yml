name: FinnGen Tests

on:
  pull_request:
    paths:
      - 'backend/app/Services/FinnGen/**'
      - 'backend/app/Http/Controllers/Api/V1/FinnGen/**'
      - 'backend/app/Http/Middleware/EnforceFinnGenIdempotency.php'
      - 'backend/app/Http/Requests/FinnGen/**'
      - 'backend/app/Jobs/FinnGen/**'
      - 'backend/app/Models/App/FinnGen/**'
      - 'backend/app/Policies/FinnGen/**'
      - 'backend/app/Console/Commands/FinnGen/**'
      - 'backend/config/finngen.php'
      - 'backend/config/horizon.php'
      - 'backend/bootstrap/app.php'
      - 'backend/routes/api.php'
      - 'backend/database/migrations/*finngen*'
      - 'backend/database/seeders/*FinnGen*'
      - 'backend/database/seeders/Testing/*FinnGen*'
      - 'backend/tests/Unit/FinnGen/**'
      - 'backend/tests/Feature/FinnGen/**'
      - 'backend/lang/en/finngen.php'
      - 'darkstar/api/finngen/**'
      - 'darkstar/tests/testthat/test-finngen-*.R'
      - 'darkstar/tests/fixtures/darkstar-finngen-shapes.json'
      - 'docker/r/Dockerfile'
      - 'frontend/src/features/_finngen-foundation/**'
      - '.github/workflows/finngen-tests.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/app/Services/FinnGen/**'
      - 'backend/app/Http/Controllers/Api/V1/FinnGen/**'
      - 'backend/app/Http/Middleware/EnforceFinnGenIdempotency.php'
      - 'backend/app/Http/Requests/FinnGen/**'
      - 'backend/app/Jobs/FinnGen/**'
      - 'backend/app/Models/App/FinnGen/**'
      - 'backend/app/Policies/FinnGen/**'
      - 'backend/app/Console/Commands/FinnGen/**'
      - 'backend/config/finngen.php'
      - 'backend/config/horizon.php'
      - 'backend/bootstrap/app.php'
      - 'backend/routes/api.php'
      - 'backend/database/migrations/*finngen*'
      - 'backend/database/seeders/*FinnGen*'
      - 'backend/database/seeders/Testing/*FinnGen*'
      - 'backend/tests/Unit/FinnGen/**'
      - 'backend/tests/Feature/FinnGen/**'
      - 'backend/lang/en/finngen.php'
      - 'darkstar/api/finngen/**'
      - 'darkstar/tests/testthat/test-finngen-*.R'
      - 'darkstar/tests/fixtures/darkstar-finngen-shapes.json'
      - 'docker/r/Dockerfile'
      - 'frontend/src/features/_finngen-foundation/**'
      - '.github/workflows/finngen-tests.yml'
  schedule:
    # 04:30 UTC nightly — slow lane (Darkstar R integration + reserved E2E slot).
    - cron: '30 4 * * *'

permissions:
  contents: read

concurrency:
  group: finngen-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FinnGen Pest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: parthenon_test
          POSTGRES_USER: parthenon
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U parthenon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install PostGIS into postgres service container
        run: |
          # Phase 19 (D-04): FinnGen migrations run the full Laravel schema,
          # including GIS tables, so this job must match the main CI postgres
          # service setup.
          PG_CID=$(docker ps --filter "ancestor=pgvector/pgvector:pg16" --format '{{.ID}}' | head -n1)
          if [ -z "$PG_CID" ]; then
            echo "Could not find pgvector postgres service container" >&2
            docker ps
            exit 1
          fi
          docker exec "$PG_CID" bash -c "apt-get update -qq && apt-get install -y --no-install-recommends postgresql-16-postgis-3"

      - name: Prepare Postgres schemas and extensions
        env:
          PGPASSWORD: secret
          PGDATABASE: parthenon_test
          PGUSER: parthenon
          POSTGRES_CREATE_TEST_DATABASE: "1"
          POSTGRES_ENABLE_POSTGIS: "1"
        run: bash scripts/ci/prepare-postgres.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, mbstring, pcntl, zip
          coverage: pcov

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction

      - name: Copy env
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate

      - name: Run migrations
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: parthenon_test
          DB_USERNAME: parthenon
          DB_PASSWORD: secret
          FINNGEN_PG_RO_PASSWORD: ci-ro-secret
          FINNGEN_PG_RW_PASSWORD: ci-rw-secret
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate --force

      - name: Run FinnGen Pest suite with coverage (80% floor)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: parthenon_test
          DB_USERNAME: parthenon
          DB_PASSWORD: secret
          # phpunit.xml forces DB_CONNECTION=pgsql_testing, which reads DB_TEST_*
          # with fallback to DB_*. Its DB_TEST_PORT default is 5480 (host PG17
          # dev convention), so without these explicit overrides the test
          # connection ignores the CI postgres service and tries port 5480.
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 5432
          DB_TEST_DATABASE: parthenon_testing
          DB_TEST_USERNAME: parthenon
          DB_TEST_PASSWORD: secret
          FINNGEN_PG_RO_PASSWORD: ci-ro-secret
          FINNGEN_PG_RW_PASSWORD: ci-rw-secret
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        # NOTE: --min=80 applies to the FinnGen service package, not the
        # whole Laravel app tree.
        run: |
          set +e
          ./vendor/bin/pest \
            tests/Unit/FinnGen tests/Feature/FinnGen \
            --do-not-fail-on-skipped \
            --do-not-fail-on-warning \
            --do-not-fail-on-phpunit-warning \
            --do-not-fail-on-deprecation \
            --do-not-fail-on-phpunit-deprecation \
            --do-not-fail-on-notice \
            --do-not-fail-on-incomplete \
            --coverage --coverage-filter=app/Services/FinnGen --min=80 \
            --coverage-clover=coverage-finngen.xml 2>&1 | tee pest-finngen.log
          pest_status=${PIPESTATUS[0]}
          set -e

          if [ "$pest_status" -ne 0 ]; then
            summary=$(grep -E 'Tests:[[:space:]]' pest-finngen.log | tail -1 || true)
            if echo "$summary" | grep -Eq '[1-9][0-9]* (failed|errored|risky)'; then
              exit "$pest_status"
            fi
            if grep -Eq 'Code coverage below expected' pest-finngen.log; then
              exit "$pest_status"
            fi
            if echo "$summary" | grep -q 'passed'; then
              echo "Pest exited $pest_status with non-failure issue statuses only; continuing."
              exit 0
            fi
            exit "$pest_status"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finngen-backend-coverage
          path: backend/coverage-finngen.xml
          retention-days: 14

  frontend:
    name: Frontend (FinnGen foundation Vitest + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Vitest (FinnGen foundation)
        working-directory: frontend
        run: npx vitest run src/features/_finngen-foundation

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite build (strictness parity)
        working-directory: frontend
        run: npm run build

  # Slow lane — nightly + main-branch push only. Not gated on PR.
  darkstar-integration:
    name: Darkstar R integration (nightly/main only)
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Build darkstar image
        run: docker compose build darkstar

      - name: Start supporting services + darkstar
        run: |
          docker compose up -d postgres redis darkstar
          # Wait for darkstar Plumber to come up (s6 + HADES package load
          # take ~60s — allow up to 5 min).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/health > /dev/null 2>&1; then
              echo "darkstar healthy"
              break
            fi
            sleep 5
          done

      - name: Run FinnGen testthat suite
        run: |
          docker compose exec -T darkstar Rscript -e \
            'testthat::test_dir("/app/tests/testthat", filter="finngen-")'

      - name: Capture darkstar logs on failure
        if: failure()
        run: docker compose logs darkstar
