name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge security and patch updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge non-major security patches after required checks pass.
      - name: Auto-merge security patches
        if: steps.metadata.outputs.ghsa-id != '' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch updates (e.g., 1.2.3 → 1.2.4)
      - name: Auto-merge patch updates
        if: steps.metadata.outputs.ghsa-id == '' && steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Label minor updates for manual review.
      - name: Label minor updates for review
        if: steps.metadata.outputs.ghsa-id == '' && steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review,minor-bump"
          gh pr comment "$PR_URL" --body "Minor dependency update detected. Please review the changelog before merging.

          **Package:** ${{ steps.metadata.outputs.dependency-names }}
          **Update:** ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Label major updates for manual review
      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review,major-bump"
          gh pr comment "$PR_URL" --body "⚠️ **Major version bump detected** — this update may contain breaking changes. Please review the changelog before merging.

          **Package:** ${{ steps.metadata.outputs.dependency-names }}
          **Update:** ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }}

          Once you've reviewed, approve the PR and it will merge automatically after CI passes."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
