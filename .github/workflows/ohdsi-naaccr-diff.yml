name: OHDSI NAACCR upstream-diff

# Phase 3 Plan 4A Task 9 (T-022A). Runs weekly + on workflow_dispatch.
# Fetches the OHDSI/CdmEtlNaaccr repo HEAD, compares against the pinned
# commit SHA in templates/commercial/runtime/commercial/registry/naaccr/ohdsi_pin.txt,
# and opens an issue if the diff exceeds N lines.
#
# Mirrors the ARTEMIS upstream-diff pattern from Phase 2 ADR 0014.

on:
  schedule:
    # 06:00 UTC every Monday — early enough that issues file before
    # the rest of the team's week begins.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diff:
    name: Diff OHDSI/CdmEtlNaaccr against pinned commit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned commit SHA
        id: pin
        run: |
          PIN_FILE=templates/commercial/runtime/commercial/registry/naaccr/ohdsi_pin.txt
          PINNED=$(grep '^commit=' "$PIN_FILE" | cut -d'=' -f2)
          REPO=$(grep '^repository=' "$PIN_FILE" | cut -d'=' -f2)
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream HEAD
        id: head
        run: |
          REPO_PATH=$(echo "${{ steps.pin.outputs.repo }}" | sed 's|https://github.com/||')
          HEAD=$(curl -fsSL "https://api.github.com/repos/$REPO_PATH/commits/HEAD" | jq -r '.sha')
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Compare pinned vs HEAD
        id: diff
        run: |
          PINNED="${{ steps.pin.outputs.pinned }}"
          HEAD="${{ steps.head.outputs.head }}"
          REPO_PATH=$(echo "${{ steps.pin.outputs.repo }}" | sed 's|https://github.com/||')
          if [ "$PINNED" = "$HEAD" ] || [ "$PINNED" = "PLACEHOLDER_REPLACE_AT_INTEGRATION" ]; then
            echo "no-drift" >> "$GITHUB_OUTPUT"
            echo "no-drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count changed lines between PINNED and HEAD via the GitHub
          # compare API. If > 50 we open an issue; smaller drift just
          # records itself in the workflow log.
          CHANGED=$(curl -fsSL \
            "https://api.github.com/repos/$REPO_PATH/compare/$PINNED...$HEAD" \
            | jq '[.files[] | (.additions + .deletions)] | add // 0')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" -gt 50 ]; then
            echo "open-issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "open-issue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open drift issue
        if: steps.diff.outputs.open-issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pinned = '${{ steps.pin.outputs.pinned }}';
            const head = '${{ steps.head.outputs.head }}';
            const changed = '${{ steps.diff.outputs.changed }}';
            const repo = '${{ steps.pin.outputs.repo }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `OHDSI NAACCR upstream drift: ${changed} lines since ${pinned.substring(0, 7)}`,
              body: [
                `# OHDSI NAACCR upstream-diff drift detected`,
                ``,
                `Repository: ${repo}`,
                `Pinned: ${pinned}`,
                `HEAD: ${head}`,
                `Changed lines: ${changed}`,
                ``,
                `Compare URL:`,
                `${repo}/compare/${pinned}...${head}`,
                ``,
                `## Action items`,
                ``,
                `1. Review the diff for changes that affect our ported`,
                `   per-domain SQL (condition_occurrence / episode /`,
                `   episode_event).`,
                `2. Re-port if needed (see ADR 0017 + the SQL stages`,
                `   under templates/commercial/manifests/registry_to_omop_naaccr/sql/).`,
                `3. Bump the commit SHA in`,
                `   templates/commercial/runtime/commercial/registry/naaccr/ohdsi_pin.txt`,
                `   and re-run the validation E2E to confirm parity.`,
                ``,
                `Generated by .github/workflows/ohdsi-naaccr-diff.yml.`,
              ].join('\n'),
              labels: ['vocab-drift', 'phase-3', 'commercial']
            });
